<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Connection - System Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">
    <!-- Styled stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-color);
            background-image:
                radial-gradient(at 15% 15%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(0, 240, 255, 0.12) 0px, transparent 50%);
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 30px 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.55), 0 0 30px rgba(0, 240, 255, 0.05);
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        .login-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .login-logo {
            width: 42px;
            height: 42px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.28);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.15);
        }

        .login-title-group h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.8px;
            margin: 0;
            line-height: 1.2;
        }

        .login-title-group p {
            color: var(--text-muted);
            font-size: 0.82rem;
            margin: 2px 0 0 0;
        }

        /* Profile Bar (Dropdown + Action Buttons) */
        .session-bar {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .session-bar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .session-bar-label {
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .session-controls-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .session-dropdown-wrapper {
            position: relative;
            flex: 1;
        }

        .session-dropdown {
            width: 100%;
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            padding: 8px 30px 8px 12px;
            font-size: 0.88rem;
            font-family: 'Outfit', sans-serif;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .session-dropdown:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .session-dropdown-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
        }

        .btn-icon-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-icon-action:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-icon-save:hover {
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.15);
        }

        .btn-icon-danger:hover {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.15);
        }

        /* Form Layout */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .login-form input[type="text"],
        .login-form input[type="number"],
        .login-form input[type="password"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 9px;
            color: #fff;
            padding: 10px 14px 10px 38px;
            font-size: 0.92rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
            background: rgba(0, 0, 0, 0.45);
        }

        .btn-connect {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(139, 92, 246, 0.3));
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 12px;
            font-size: 1.05rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.18);
            margin-top: 4px;
        }

        .btn-connect:hover {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.45), rgba(139, 92, 246, 0.45));
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.35);
            transform: translateY(-1px);
        }

        .btn-connect:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.38);
            border-radius: 9px;
            padding: 10px 14px;
            color: #fca5a5;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 14px;
            animation: fadeIn 0.2s ease;
        }

        /* Key Input Mode Switcher & In-Memory Styles */
        .key-mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.38);
            border: 1px solid var(--panel-border);
            border-radius: 9px;
            padding: 3px;
            gap: 4px;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .key-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 7px 10px;
            font-size: 0.78rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .key-tab-btn.active {
            background: rgba(0, 240, 255, 0.16);
            color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            border: 1px solid rgba(0, 240, 255, 0.35);
        }

        .key-tab-btn:hover:not(.active) {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .key-dropzone {
            border: 2px dashed rgba(0, 240, 255, 0.35);
            border-radius: 10px;
            padding: 18px 14px;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .key-dropzone:hover, .key-dropzone.dragover {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.2);
        }

        .key-dropzone-icon {
            color: var(--accent-cyan);
        }

        .key-dropzone-text {
            font-size: 0.86rem;
            color: #e2e8f0;
            font-weight: 500;
        }

        .key-dropzone-sub {
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .key-file-loaded {
            display: none;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 9px;
            padding: 10px 14px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            animation: fadeIn 0.2s ease;
        }

        .key-file-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .key-badge-ram {
            background: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
            font-size: 0.68rem;
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .key-file-name {
            font-family: monospace;
            font-size: 0.86rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-clear-key {
            background: transparent;
            border: none;
            color: #f87171;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            border-radius: 5px;
            transition: background 0.15s;
        }

        .btn-clear-key:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .key-textarea {
            width: 100%;
            height: 95px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--panel-border);
            border-radius: 9px;
            color: #67e8f9;
            font-family: monospace;
            font-size: 0.78rem;
            padding: 8px 12px;
            resize: vertical;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .key-textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }

        .key-security-note {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            color: #34d399;
        }

        /* Sleek Popup Modal for Save Session */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.15s ease;
        }

        .modal-box {
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 240, 255, 0.15);
            border-radius: 14px;
            padding: 22px 24px;
            width: 100%;
            max-width: 380px;
        }

        .modal-box h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.25rem;
            margin: 0 0 6px 0;
            color: #fff;
        }

        .modal-box p {
            font-size: 0.84rem;
            color: var(--text-muted);
            margin: 0 0 16px 0;
        }

        .modal-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            padding: 10px 12px;
            font-size: 0.92rem;
            font-family: 'Outfit', sans-serif;
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-modal {
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-modal-cancel {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--panel-border);
        }

        .btn-modal-cancel:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-modal-save {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--accent-cyan);
            color: #fff;
        }

        .btn-modal-save:hover {
            background: rgba(0, 240, 255, 0.35);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(16, 185, 129, 0.95);
            color: #fff;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: none;
            z-index: 1100;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="login-page">
    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <div class="login-brand">
                <div class="login-logo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                        <line x1="6" y1="6" x2="6.01" y2="6"></line>
                        <line x1="6" y1="18" x2="6.01" y2="18"></line>
                    </svg>
                </div>
                <div class="login-title-group">
                    <h1>SSH MONITOR</h1>
                    <p>Connect to remote host</p>
                </div>
            </div>
        </div>

        <div id="error-banner" class="error-banner"></div>

        <!-- Sleek Session Profile Dropdown Bar -->
        <div class="session-bar">
            <div class="session-bar-top">
                <span class="session-bar-label">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Saved Session Profile
                </span>
                <span style="font-size: 0.72rem; color: var(--text-muted);">Browser Memory</span>
            </div>

            <div class="session-controls-row">
                <div class="session-dropdown-wrapper">
                    <select id="session-select" class="session-dropdown">
                        <!-- Populated dynamically from localStorage -->
                    </select>
                    <svg class="session-dropdown-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>

                <button type="button" id="btn-save-current" class="btn-icon-action btn-icon-save" title="Save / Update profile in browser memory">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    </svg>
                    Save
                </button>

                <button type="button" id="btn-delete" class="btn-icon-action btn-icon-danger" title="Delete selected profile">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Connection Form -->
        <form id="login-form" class="login-form">
            <!-- Host and Port -->
            <div class="form-row">
                <div class="form-group">
                    <label for="host">Host / IP Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path
                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                            </path>
                        </svg>
                        <input type="text" id="host" name="host" placeholder="e.g. 192.168.1.100 or domain" required autofocus
                            autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="port">Port</label>
                    <div class="input-wrapper">
                        <input type="number" id="port" name="port" value="22" style="padding-left: 14px;" required>
                    </div>
                </div>
            </div>

            <!-- Username and Sudo Password -->
            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" name="username" placeholder="e.g. opc or root" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sudo_password">Sudo Password <span
                            style="font-weight: 400; text-transform: none; color: var(--text-muted);">(optional)</span></label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="sudo_password" name="sudo_password"
                            placeholder="Optional">
                    </div>
                </div>
            </div>

            <!-- SSH Private Key Section -->
            <div class="form-group" style="margin-top: 2px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>SSH Private Key</label>
                    <span class="key-security-note">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        In-Memory (RAM Only)
                    </span>
                </div>

                <!-- Tabs: Upload / Paste / Server Path -->
                <div class="key-mode-tabs">
                    <button type="button" class="key-tab-btn active" id="tab-btn-upload">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Upload Key File
                    </button>
                    <button type="button" class="key-tab-btn" id="tab-btn-paste">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                        Paste Key Content
                    </button>
                    <button type="button" class="key-tab-btn" id="tab-btn-path">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                        </svg>
                        Server File Path
                    </button>
                </div>

                <!-- Mode 1: File Upload (In-Memory) -->
                <div id="key-view-upload">
                    <input type="file" id="key-file-input" style="display: none;" accept=".key,.pem,.id_rsa,.pub,*">
                    <div class="key-dropzone" id="key-dropzone">
                        <svg class="key-dropzone-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <div class="key-dropzone-text">Click or drop your private key (.key, .pem) here</div>
                        <div class="key-dropzone-sub">Loaded directly into RAM — never saved to VM disk</div>
                    </div>
                    <div class="key-file-loaded" id="key-file-loaded">
                        <div class="key-file-meta">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            <span class="key-file-name" id="key-loaded-filename">id_rsa.pem</span>
                            <span class="key-badge-ram">In Memory</span>
                        </div>
                        <button type="button" class="btn-clear-key" id="btn-clear-file" title="Remove key">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Mode 2: Paste Content (In-Memory) -->
                <div id="key-view-paste" style="display: none;">
                    <textarea id="key_content_paste" class="key-textarea" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----"></textarea>
                </div>

                <!-- Mode 3: Server Path (On VM disk) -->
                <div id="key-view-path" style="display: none;">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 2l-2 2m-1-1l-3 3m0 0l-3-3m3 3l-3 3m-4 1a5 5 0 1 0-7 7 5 5 0 0 0 7-7l8-8"></path>
                        </svg>
                        <input type="text" id="key_path" name="key_path" placeholder="e.g. /home/opc/.ssh/id_rsa">
                    </div>
                </div>

                <!-- Key Passphrase (Optional) -->
                <div style="margin-top: 8px;">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="key_passphrase" name="key_passphrase" placeholder="Key Passphrase (optional, if key is encrypted)">
                    </div>
                </div>
            </div>

            <!-- Connect Button -->
            <button type="submit" id="btn-submit" class="btn-connect">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
                <span id="btn-text">Connect to Host</span>
            </button>
        </form>
    </div>

    <!-- Popup Modal for Saving New Session -->
    <div id="save-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Save Session Profile</h3>
            <p>Enter a name for this session to save it in browser memory.</p>
            <input type="text" id="modal-session-name" class="modal-input" placeholder="e.g. OCI Ampere VM" autofocus>
            <div class="modal-actions">
                <button type="button" id="btn-modal-cancel" class="btn-modal btn-modal-cancel">Cancel</button>
                <button type="button" id="btn-modal-confirm" class="btn-modal btn-modal-save">Save Profile</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const STORAGE_KEY = 'ssh_dashboard_saved_sessions';

        const hostInput = document.getElementById('host');
        const portInput = document.getElementById('port');
        const userInput = document.getElementById('username');
        const sudoInput = document.getElementById('sudo_password');
        const passphraseInput = document.getElementById('key_passphrase');

        // Key Controls
        const tabBtnUpload = document.getElementById('tab-btn-upload');
        const tabBtnPaste = document.getElementById('tab-btn-paste');
        const tabBtnPath = document.getElementById('tab-btn-path');
        const viewUpload = document.getElementById('key-view-upload');
        const viewPaste = document.getElementById('key-view-paste');
        const viewPath = document.getElementById('key-view-path');

        const keyDropzone = document.getElementById('key-dropzone');
        const keyFileInput = document.getElementById('key-file-input');
        const keyFileLoaded = document.getElementById('key-file-loaded');
        const keyLoadedFilename = document.getElementById('key-loaded-filename');
        const btnClearFile = document.getElementById('btn-clear-file');
        const pasteTextarea = document.getElementById('key_content_paste');
        const keyPathInput = document.getElementById('key_path');

        let currentKeyMode = 'upload';
        let inMemoryKeyContent = '';
        let inMemoryKeyName = '';

        function setKeyMode(mode) {
            currentKeyMode = mode;
            tabBtnUpload.classList.toggle('active', mode === 'upload');
            tabBtnPaste.classList.toggle('active', mode === 'paste');
            tabBtnPath.classList.toggle('active', mode === 'path');

            viewUpload.style.display = (mode === 'upload') ? 'block' : 'none';
            viewPaste.style.display = (mode === 'paste') ? 'block' : 'none';
            viewPath.style.display = (mode === 'path') ? 'block' : 'none';
        }

        tabBtnUpload.addEventListener('click', () => setKeyMode('upload'));
        tabBtnPaste.addEventListener('click', () => setKeyMode('paste'));
        tabBtnPath.addEventListener('click', () => setKeyMode('path'));

        // File dropzone handlers
        keyDropzone.addEventListener('click', () => keyFileInput.click());

        keyDropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            keyDropzone.classList.add('dragover');
        });

        keyDropzone.addEventListener('dragleave', () => {
            keyDropzone.classList.remove('dragover');
        });

        keyDropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            keyDropzone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleSelectedFile(e.dataTransfer.files[0]);
            }
        });

        keyFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleSelectedFile(e.target.files[0]);
            }
        });

        function handleSelectedFile(file) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                inMemoryKeyContent = evt.target.result;
                inMemoryKeyName = file.name;
                keyLoadedFilename.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                keyDropzone.style.display = 'none';
                keyFileLoaded.style.display = 'flex';
                pasteTextarea.value = inMemoryKeyContent;
            };
            reader.readAsText(file);
        }

        btnClearFile.addEventListener('click', (e) => {
            e.stopPropagation();
            inMemoryKeyContent = '';
            inMemoryKeyName = '';
            keyFileInput.value = '';
            keyFileLoaded.style.display = 'none';
            keyDropzone.style.display = 'flex';
        });

        // Profiles management
        const sessionSelect = document.getElementById('session-select');
        const btnSaveCurrent = document.getElementById('btn-save-current');
        const btnDelete = document.getElementById('btn-delete');

        const saveModal = document.getElementById('save-modal');
        const modalInput = document.getElementById('modal-session-name');
        const btnModalCancel = document.getElementById('btn-modal-cancel');
        const btnModalConfirm = document.getElementById('btn-modal-confirm');

        const form = document.getElementById('login-form');
        const errBanner = document.getElementById('error-banner');
        const submitBtn = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        function getStoredSessions() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) return JSON.parse(data);
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        function saveStoredSessions(sessions) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
            } catch (e) {
                console.error(e);
            }
        }

        function populateDropdown(activeName = null) {
            const sessions = getStoredSessions() || {};
            sessionSelect.innerHTML = '';

            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = Object.keys(sessions).length > 0 
                ? '-- Select a saved profile --' 
                : '-- No saved profiles --';
            sessionSelect.appendChild(defaultOpt);

            const names = Object.keys(sessions);
            names.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = `${name} (${sessions[name].host || 'unconfigured'})`;
                sessionSelect.appendChild(opt);
            });

            if (activeName && sessions[activeName]) {
                sessionSelect.value = activeName;
                loadSessionIntoForm(sessions[activeName]);
            } else {
                sessionSelect.value = '';
            }
        }

        function loadSessionIntoForm(sess) {
            if (!sess) return;
            hostInput.value = sess.host || '';
            portInput.value = sess.port || 22;
            userInput.value = sess.username || '';
            sudoInput.value = sess.sudo_password || '';
            passphraseInput.value = sess.passphrase || '';

            if (sess.key_content) {
                inMemoryKeyContent = sess.key_content;
                inMemoryKeyName = sess.key_name || 'Saved Key';
                keyLoadedFilename.textContent = inMemoryKeyName;
                keyDropzone.style.display = 'none';
                keyFileLoaded.style.display = 'flex';
                pasteTextarea.value = sess.key_content;
                setKeyMode(sess.key_mode || 'upload');
            } else if (sess.key_path) {
                keyPathInput.value = sess.key_path;
                setKeyMode('path');
            }
        }

        function clearForm() {
            hostInput.value = '';
            portInput.value = '22';
            userInput.value = '';
            sudoInput.value = '';
            passphraseInput.value = '';
            keyPathInput.value = '';
            pasteTextarea.value = '';
            inMemoryKeyContent = '';
            inMemoryKeyName = '';
            keyFileLoaded.style.display = 'none';
            keyDropzone.style.display = 'flex';
            setKeyMode('upload');
        }

        sessionSelect.addEventListener('change', () => {
            const sessions = getStoredSessions() || {};
            const selected = sessionSelect.value;
            if (selected && sessions[selected]) {
                loadSessionIntoForm(sessions[selected]);
                showToast(`Loaded "${selected}"`);
            } else {
                clearForm();
            }
        });

        function getProfilePayload(name) {
            let keyContentToSave = '';
            let keyPathToSave = '';
            let keyNameToSave = '';

            if (currentKeyMode === 'upload' || currentKeyMode === 'paste') {
                keyContentToSave = inMemoryKeyContent || pasteTextarea.value.trim();
                keyNameToSave = inMemoryKeyName || 'In-Memory Key';
            } else {
                keyPathToSave = keyPathInput.value.trim();
                keyNameToSave = keyPathToSave.split(/[/\\]/).pop();
            }

            return {
                name: name,
                host: hostInput.value.trim(),
                port: parseInt(portInput.value, 10) || 22,
                username: userInput.value.trim(),
                key_mode: currentKeyMode,
                key_path: keyPathToSave,
                key_content: keyContentToSave,
                key_name: keyNameToSave,
                sudo_password: sudoInput.value,
                passphrase: passphraseInput.value
            };
        }

        btnSaveCurrent.addEventListener('click', () => {
            if (!hostInput.value.trim() && !userInput.value.trim()) {
                alert('Please enter host and user details before saving.');
                return;
            }

            const currentName = sessionSelect.value;
            if (!currentName) {
                openSaveModal();
                return;
            }

            const sessions = getStoredSessions() || {};
            sessions[currentName] = getProfilePayload(currentName);
            saveStoredSessions(sessions);
            populateDropdown(currentName);
            showToast(`Updated "${currentName}"`);
        });

        function openSaveModal() {
            modalInput.value = sessionSelect.value || '';
            saveModal.style.display = 'flex';
            modalInput.focus();
            modalInput.select();
        }

        btnModalCancel.addEventListener('click', () => {
            saveModal.style.display = 'none';
        });

        btnModalConfirm.addEventListener('click', () => {
            const name = modalInput.value.trim();
            if (!name) {
                alert('Please enter a session profile name.');
                return;
            }

            const sessions = getStoredSessions() || {};
            sessions[name] = getProfilePayload(name);
            saveStoredSessions(sessions);
            saveModal.style.display = 'none';
            populateDropdown(name);
            showToast(`Saved new profile "${name}"`);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && saveModal.style.display === 'flex') {
                saveModal.style.display = 'none';
            }
        });

        btnDelete.addEventListener('click', () => {
            const currentName = sessionSelect.value;
            if (!currentName) return;

            if (confirm(`Delete saved profile "${currentName}"?`)) {
                const sessions = getStoredSessions() || {};
                delete sessions[currentName];
                saveStoredSessions(sessions);
                populateDropdown();
                showToast(`Deleted "${currentName}"`);
            }
        });

        // Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errBanner.style.display = 'none';
            submitBtn.disabled = true;
            btnText.textContent = 'Connecting via SSH...';

            let keyContentToSend = '';
            let keyPathToSend = '';
            let keyNameToSend = '';

            if (currentKeyMode === 'upload') {
                keyContentToSend = inMemoryKeyContent;
                keyNameToSend = inMemoryKeyName;
            } else if (currentKeyMode === 'paste') {
                keyContentToSend = pasteTextarea.value.trim();
                keyNameToSend = 'Pasted Key';
            } else if (currentKeyMode === 'path') {
                keyPathToSend = keyPathInput.value.trim();
                keyNameToSend = keyPathToSend.split(/[/\\]/).pop();
            }

            if (!keyContentToSend && !keyPathToSend) {
                errBanner.textContent = 'Please upload a key file, paste key content, or provide a server file path.';
                errBanner.style.display = 'block';
                submitBtn.disabled = false;
                btnText.textContent = 'Connect to Host';
                return;
            }

            const payload = {
                host: hostInput.value.trim(),
                username: userInput.value.trim(),
                port: parseInt(portInput.value, 10) || 22,
                key_content: keyContentToSend,
                key_path: keyPathToSend,
                key_name: keyNameToSend,
                passphrase: passphraseInput.value,
                sudo_password: sudoInput.value
            };

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    btnText.textContent = 'Connected! Opening...';
                    window.location.href = '/memory';
                } else {
                    errBanner.textContent = data.message || 'SSH connection failed. Please verify host, username, and key file.';
                    errBanner.style.display = 'block';
                    submitBtn.disabled = false;
                    btnText.textContent = 'Connect to Host';
                }
            } catch (err) {
                errBanner.textContent = 'Network or server error: ' + err.message;
                errBanner.style.display = 'block';
                submitBtn.disabled = false;
                btnText.textContent = 'Connect to Host';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            populateDropdown();
        });
    </script>
</body>

</html>
